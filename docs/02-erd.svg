<text x="26" y="692" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">ux_requests_receipt — official_receipt_no is UNIQUE; unpaid rows stay NULL, so any number of unpaid requests can coexist.</text>
<text x="26" y="708" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">ux_requests_jobseeker — jobseeker_guard is a generated column repeating resident_id while a first-time jobseeker request is live: one per resident, no trigger.</text>
<text x="26" y="724" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">resident_snapshots freezes the resident's details at request time — later profile edits never rewrite history.</text>
<text x="26" y="740" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">fee_schedule is seeded by schema.sql with the Citizen's Charter rates and their legal bases (docs/07); FeeSchedule reads it at startup. No FK — each request keeps its fee.</text>
<text x="26" y="756" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">scope carries the Charter clearance pricing: 0 = local employment (PHP 100) · 1 = work abroad (PHP 200).</text>
</svg>