<text x="26" y="748" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">ux_requests_receipt — official_receipt_no is UNIQUE; unpaid rows stay NULL, so unpaid requests never collide.</text>
<text x="26" y="764" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">ux_requests_jobseeker — jobseeker_guard is a generated column repeating resident_id while a first-time jobseeker</text>
<text x="26" y="780" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">request is live: one per resident, no trigger.  resident_snapshots freezes the resident's details at request time.</text>
<text x="26" y="796" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">fee_schedule holds the Citizen's Charter rates + legal bases (docs/07), seeded by schema.sql, read by FeeSchedule.</text>
<text x="26" y="812" font-size="10" font-style="italic" fill="#9aa0a6" font-family="Helvetica,Arial,sans-serif">scope prices the clearance: 0 = local employment (PHP 100) · 1 = work abroad (PHP 200).</text>
