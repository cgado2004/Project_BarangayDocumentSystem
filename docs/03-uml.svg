<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      text { font-family: "Segoe UI", -apple-system, "Noto Sans", "DejaVu Sans", sans-serif; }
      .mono { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; }
      .state   { fill:#FFFFFF; stroke:#06155A; stroke-width:2; }
      .stateT  { stroke-width:3; }
      .stname  { font-size:15px; font-weight:700; fill:#06155A; }
      .rel     { stroke:#0616C1; stroke-width:2; fill:none; }
      .lbl     { font-size:11.5px; fill:#55575B; }
      .evt     { font-size:12px; font-weight:700; fill:#06155A; }
      .guard   { font-size:11px; fill:#8A5A00; font-weight:600; }
      .note    { font-size:11.5px; fill:#55575B; }
      .notehd  { font-size:13px; fill:#06155A; font-weight:700; }
      .notebox { fill:#F4F7FE; stroke:#B7D0F2; stroke-width:1.5; }
      .title   { font-size:21px; font-weight:700; fill:#04060F; }
      .sub     { font-size:13px; fill:#7A8794; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0616C1"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="36" y="42" class="title">State Machine Diagram — Document Requests</text>
  <text x="36" y="64" class="sub">Pending → Processing → Ready for release → Released, or Rejected — guards exactly as enforced in code (RequireStatus)</text>

  <!-- initial pseudo-state -->
  <circle cx="70" cy="355" r="8" fill="#06155A"/>
  <path d="M78 355 H140" class="rel" marker-end="url(#arrow)"/>
  <text x="104" y="306" class="lbl" text-anchor="middle">snapshot saved</text>
  <text x="104" y="324" class="lbl" text-anchor="middle">fee assessed,</text>
  <text x="104" y="344" class="evt" text-anchor="middle">create request</text>

  <!-- states -->
  <g>
    <rect x="140" y="300" width="160" height="110" rx="12" class="state"/>
    <text x="220" y="360" class="stname" text-anchor="middle">Pending</text>
  </g>
  <g>
    <rect x="390" y="300" width="160" height="110" rx="12" class="state"/>
    <text x="470" y="360" class="stname" text-anchor="middle">Processing</text>
  </g>
  <g>
    <rect x="620" y="300" width="200" height="110" rx="12" class="state"/>
    <text x="720" y="360" class="stname" text-anchor="middle">Ready for release</text>
  </g>
  <g>
    <rect x="950" y="300" width="150" height="110" rx="12" class="state stateT" fill="#F0FAF2"/>
    <text x="1025" y="360" class="stname" text-anchor="middle">Released</text>
  </g>
  <g>
    <rect x="590" y="520" width="170" height="110" rx="12" class="state stateT" fill="#FDF2F1"/>
    <text x="675" y="580" class="stname" text-anchor="middle">Rejected</text>
  </g>

  <!-- forward transitions -->
  <path d="M300 355 H390" class="rel" marker-end="url(#arrow)"/>
  <text x="345" y="338" class="evt" text-anchor="middle">start processing</text>

  <path d="M550 355 H620" class="rel" marker-end="url(#arrow)"/>
  <text x="585" y="338" class="evt" text-anchor="middle">mark ready</text>

  <path d="M820 355 H950" class="rel" marker-end="url(#arrow)"/>
  <text x="885" y="308" class="guard" text-anchor="middle">[free or already paid]</text>
  <text x="885" y="326" class="guard" text-anchor="middle">[jobseeker: once only]</text>
  <text x="885" y="344" class="evt" text-anchor="middle">release</text>

  <!-- terminals -->
  <path d="M1100 355 H1140" class="rel" marker-end="url(#arrow)"/>
  <circle cx="1152" cy="355" r="8" fill="#06155A"/>
  <path d="M675 630 V666" class="rel" marker-end="url(#arrow)"/>
  <circle cx="675" cy="678" r="8" fill="#06155A"/>

  <!-- reject bus -->
  <path d="M220 410 V470" class="rel"/>
  <path d="M470 410 V470" class="rel"/>
  <path d="M720 410 V470" class="rel"/>
  <path d="M220 470 H720" class="rel"/>
  <path d="M675 470 V520" class="rel" marker-end="url(#arrow)"/>
  <text x="232" y="446" class="evt">reject</text>
  <text x="482" y="446" class="evt">reject</text>
  <text x="708" y="446" class="evt" text-anchor="end">reject</text>

  <!-- payment self-loops: state unchanged -->
  <path d="M185 300 C185 266 255 266 255 300" class="rel" marker-end="url(#arrow)"/>
  <text x="220" y="256" class="lbl" text-anchor="middle">record payment (OR number)</text>

  <path d="M435 300 C435 266 505 266 505 300" class="rel" marker-end="url(#arrow)"/>
  <text x="470" y="256" class="lbl" text-anchor="middle">record payment (OR number)</text>

  <path d="M685 300 C685 266 755 266 755 300" class="rel" marker-end="url(#arrow)"/>
  <text x="720" y="256" class="lbl" text-anchor="middle">record payment (OR number)</text>

  <!-- notes -->
  <g>
    <rect x="920" y="470" width="324" height="214" rx="8" class="notebox"/>
    <text x="938" y="496" class="notehd">Terminal states and payment</text>
    <text x="938" y="520" class="note">Rejected and Released are terminal</text>
    <text x="938" y="537" class="note">states.</text>
    <text x="938" y="561" class="note">RecordPayment never changes the state</text>
    <text x="938" y="578" class="note">(Pending / Processing / Ready for</text>
    <text x="938" y="595" class="note">release) — it only writes the amount</text>
    <text x="938" y="612" class="note">against the official receipt number.</text>
    <text x="938" y="640" class="note">Guards exactly as enforced by</text>
    <text x="938" y="657" class="note">Services/RequestService.cs (RequireStatus)</text>
  </g>

  <text x="36" y="700" class="sub">filled circle = initial / terminal state · [brackets] = guard · self-loop = an event that leaves the state unchanged</text>
</svg>
