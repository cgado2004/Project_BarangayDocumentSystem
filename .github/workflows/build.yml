# Builds the solution on a real Windows runner with Visual Studio 2022,
# exactly the way the README tells the group to build it locally.
# The build fails (red X) when any .cs file does not compile.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Register MSBuild problem matcher
        run: echo "::add-matcher::.github/msbuild-matcher.json"

      - name: Restore NuGet packages
        run: msbuild /t:Restore BarangayDocumentSystem.sln /p:Configuration=Debug /m

      - name: Build (Debug)
        run: msbuild BarangayDocumentSystem.sln /p:Configuration=Debug /m /v:m /nologo

      - name: Run the rule checks
        shell: pwsh
        run: |
          $exe = "tests\RuleChecks\bin\Debug\RuleChecks.exe"
          $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru `
               -RedirectStandardOutput "rulechecks.out" -RedirectStandardError "rulechecks.err"
          $lines = @()
          if (Test-Path rulechecks.out) { $lines += Get-Content rulechecks.out }
          if (Test-Path rulechecks.err) { $lines += Get-Content rulechecks.err }
          Write-Host ($lines -join "`n")
          if ($p.ExitCode -ne 0) {
            foreach ($line in $lines) {
              if ($line -match 'FAIL|Exception|Unhandled|inner exception|BarangayDocumentSystem\.') {
                Write-Host ("::error title=RuleChecks::" + $line.Trim())
              }
            }
            exit $p.ExitCode
          }

      - name: Static structure checks
        shell: pwsh
        run: python scripts/check_structure.py
