# Builds the solution on a real Windows runner with Visual Studio 2022,
# exactly the way the README tells the group to build it locally.
# The build fails (red X) when any .cs file does not compile.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Register MSBuild problem matcher
        run: echo "::add-matcher::.github/msbuild-matcher.json"

      - name: Restore NuGet packages
        run: msbuild /t:Restore BarangayDocumentSystem.sln /p:Configuration=Debug /m

      - name: Build (Debug)
        run: msbuild BarangayDocumentSystem.sln /p:Configuration=Debug /m /v:m /nologo

      - name: Run the rule checks
        shell: cmd
        run: |
          tests\RuleChecks\bin\Debug\RuleChecks.exe > rulechecks.out 2> rulechecks.err
          set RC=%ERRORLEVEL%
          if %RC% NEQ 0 echo ::error::RuleChecks exited with code %RC%
          findstr /C:"FAIL" /C:"Exception" /C:"Unhandled" rulechecks.out rulechecks.err > matched.txt 2>nul
          for /f "delims=" %%L in (matched.txt) do echo ::error::%%L
          type rulechecks.out
          type rulechecks.err
          if %RC% NEQ 0 exit /b %RC%

      - name: Publish the rule-check output where it can be read
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = ""
          if (Test-Path rulechecks.out) { $out += Get-Content rulechecks.out -Raw }
          if (Test-Path rulechecks.err) { $out += "`n--- stderr ---`n" + (Get-Content rulechecks.err -Raw) }
          $payload = @{
            name = "rule-checks-output"
            head_sha = "${{ github.sha }}"
            status = "completed"
            conclusion = "failure"
            output = @{
              title = "RuleChecks full output"
              summary = "The rule checks failed; the complete output is in this check run's text."
              text = $out
            }
          } | ConvertTo-Json -Depth 6
          $payload | gh api --method POST "repos/${{ github.repository }}/check-runs" --input -

      - name: Static structure checks
        shell: pwsh
        run: python scripts/check_structure.py
