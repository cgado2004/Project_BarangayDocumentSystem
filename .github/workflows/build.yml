# Builds the solution on a real Windows runner with Visual Studio 2022,
# exactly the way the README tells the group to build it locally.
# The build fails (red X) when any .cs file does not compile.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Register MSBuild problem matcher
        run: echo "::add-matcher::.github/msbuild-matcher.json"

      - name: Restore NuGet packages
        run: msbuild /t:Restore BarangayDocumentSystem.sln /p:Configuration=Debug /m

      - name: Build (Debug)
        run: msbuild BarangayDocumentSystem.sln /p:Configuration=Debug /m /v:m /nologo

      - name: Run the rule checks
        shell: pwsh
        run: |
          $output = & tests\RuleChecks\bin\Debug\RuleChecks.exe 2>&1 | Out-String
          Write-Host $output
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            foreach ($line in ($output -split "`r?`n")) {
              if ($line -match 'FAIL|Exception|Unhandled|inner exception|at BarangayDocumentSystem') {
                Write-Host "::error title=RuleChecks::$($line.Trim())"
              }
            }
            exit $code
          }

      - name: Static structure checks
        shell: pwsh
        run: python scripts/check_structure.py
