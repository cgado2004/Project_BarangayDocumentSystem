<circle cx="118" cy="960" r="5" class="rel"/>
<line x1="128" y1="960" x2="142" y2="952" class="rel"/>
<line x1="128" y1="960" x2="142" y2="968" class="rel"/>
<text x="156" y="964" class="legend">zero or many</text>
<rect x="84" y="980" width="58" height="18" class="tbl"/>
<text x="156" y="994" class="legend">table - every column from Data/Schema.sql</text>
<text x="84" y="1022" class="pk">PK</text>
<text x="114" y="1022" class="legend">primary key</text>
<text x="230" y="1022" class="fk">FK</text>
<text x="260" y="1022" class="legend">foreign key</text>
<text x="84" y="1048" class="type">CHECK</text>
<text x="132" y="1048" class="legend">constraint or default kept from the SQL</text>
