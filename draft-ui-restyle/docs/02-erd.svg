<rect x="700" y="700" width="516" height="356" class="notebox"/>
<text x="714" y="718" class="notehd">Indexes on DocumentRequests</text>
<text x="714" y="735" class="note">UX_Requests_Receipt    unique (OfficialReceiptNumber)</text>
<text x="714" y="752" class="note">                           WHERE IsPaid = 1   (filtered)</text>
<text x="714" y="769" class="note">UX_Requests_Jobseeker  unique (ResidentId)</text>
<text x="714" y="786" class="note">                           WHERE DocumentType = 5</text>
<text x="714" y="803" class="note">                             AND Status &lt;&gt; 4   (filtered)</text>
<text x="714" y="820" class="note">IX_Requests_Resident   nonclustered (ResidentId)</text>
<text x="714" y="854" class="notehd">Rules the server enforces</text>
<text x="714" y="871" class="note">CK_Requests_Payment     paid = receipt + date + fee &gt; 0</text>
<text x="714" y="888" class="note">CK_Requests_Release     released = date + text + paid-or-free</text>
<text x="714" y="905" class="note">CK_Requests_Rejection   rejected = reason required</text>
<text x="714" y="922" class="note">CK_Residents_Dates      residency on or after birth</text>
<text x="714" y="939" class="note">FK_Requests_Residents   no cascade: delete blocked while</text>
<text x="714" y="956" class="note">                           request history exists</text>
<text x="714" y="990" class="notehd">Snapshots</text>
<text x="714" y="1007" class="note">Request + snapshot inserts are one transaction.</text>
<text x="714" y="1024" class="note">Snapshot rows keep the resident details as they were</text>
<text x="714" y="1041" class="note">when the request was filed, on purpose.</text>
<rect x="70" y="880" width="380" height="180" class="notebox"/>
<text x="84" y="904" class="notehd">Legend</text>
